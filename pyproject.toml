[project]
name = "fastapi-mcp-toolsets"
version = "0.1.0"
description = "Serve Pydantic AI tools, toolsets and agents as an MCP server from FastAPI"
license = "MIT"
keywords = ["mcp", "fastapi", "pydantic-ai", "model-context-protocol", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "fastapi-injected>=0.3.6",
    "mcp>=2.3.0",
    "pydantic-ai-slim>=2.54.0",
]

[project.scripts]
fastapi-mcp-stdio = "fastapi_mcp_toolsets.stdio.__main__:app"

[project.optional-dependencies]
stdio = [
  "httpx2[ws]>=2.13.1",
  "typer>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.6.2",
    "pydantic-ai-harness[codemode]>=0.54.0",
    "pydantic-ai-slim[mcp]>=2.54.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "ALL",  # select all checks by default
]
ignore = [
    # single rule exclude
    "ASYNC240", # allow async functions to use pathlib.Path methods
    "B008",    # do not perform function calls in argument defaults
    "S101",    # use of assert detected
    "SIM114",  # allow have multiple ifs with same body
    "TRY003",  # allow long exc message
    "RUF100",  # allow unused noqa
    "RUF012",  # allow mutable class var
    "COM812",  # will be handled by ruff format
    "ISC001",  # will be handled by ruff format
    "SLF001",  # allow access to private member
    "N806",    # allow variable name to start from uppercase letter
    "N805",    # ignore first argument name check
    "N818",    # ignore exception name should ends with Error suffix
    "FAST002", # allow to use non-annotated dependencies
    "PLR0913", # allow more than 5 arguments
    "PLR2004", # allow to compare with "magic numbers"
    "PLR0917", # allow too many positional arguments
    "PLW0108", # allow lambda with unnecessary function call
    "TC001",   # ignore moving things to if TYPE_CHECKING block
    "TC002",   # ignore moving things to if TYPE_CHECKING block
    "TC003",   # ignore moving things to if TYPE_CHECKING block
    "A005",    # allow module name to shadow a Python standard-library module
    "TC006",   # ignore quotes in typing.cast calls
    "PLC0415", # allow to have local imports
    "CPY001",  # ignore copyright

    # full rule exclude
    "D",    # ignore docstrings
    "FA",  # ignore future annotations
    "ANN", # ignore annotations
    "FIX", # ignore FIXMEs
    "TD",  # ignore all TODOs
    "ARG", # ignore unused arguments
    "FBT", # ignore flake8-boolean-trap
    "EM",  # ignore error message formatting
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

# A plain table: an inline one may not span lines for the TOML parser pytest uses.
[tool.ruff.lint.per-file-ignores]
"examples/*" = [
    "INP001", # examples are standalone scripts, not a package
    "T201",   # examples may print
]

[tool.ty.environment]
python = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
